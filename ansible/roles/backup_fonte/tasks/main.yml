---
# ==========================================
# PREPARAÇÃO DE LOGS (LOGROTATE E PASTAS)
# ==========================================
- name: Garantir que o diretorio de logs do Rails existe
  ansible.builtin.file:
    path: /home/ubuntu/AdAlive-Apps/Logs
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Configurar logrotate para as aplicacoes
  ansible.builtin.copy:
    dest: /etc/logrotate.d/aplicacoes
    owner: root
    group: root
    mode: '0644'
    content: |
      {% set ns = namespace(rails_rotacionado=false) %}
      {% for app in aplicacoes %}
      
      {% if app.tipo_app == 'rails' %}
      {% if not ns.rails_rotacionado %}
      {{ app.caminho_base | default('/home/ubuntu/AdAlive-Apps') }}/Logs/*.log {
          su ubuntu ubuntu
          daily
          missingok
          rotate 7
          compress
          notifempty
          copytruncate
          dateext
          dateyesterday
          dateformat .%Y-%m-%d
      }
      {% set ns.rails_rotacionado = true %}
      {% endif %}
      
      {% elif app.tipo_app == 'tomcat' %}
      {{ app.caminho_base | default('/home/ubuntu') }}/{{ app.nome_pasta }}/logs/catalina.out
      {{ app.caminho_base | default('/home/ubuntu') }}/{{ app.nome_pasta }}/logs/*.log
      {{ app.caminho_base | default('/home/ubuntu') }}/{{ app.nome_pasta }}/logs/*.txt {
          su ubuntu ubuntu
          daily
          missingok
          rotate 7
          compress
          notifempty
          copytruncate
          dateext
          dateyesterday
          dateformat .%Y-%m-%d
      }
      
      {% elif app.tipo_app == 'quarkus' %}
      {{ app.caminho_base | default('/u01/microservices') }}/logs/{{ app.log_principal }} {
          daily
          rotate 3
          copytruncate
          missingok
          dateext
          dateyesterday
          dateformat .%Y-%m-%d
          compress
          notifempty
      }
      {% endif %}
      
      {% endfor %}
  when: aplicacoes is defined

# Opcional, mas muito recomendado: Remover o logrotate legado que você identificou
- name: Remover regra legada de logrotate do Quarkus (se existir)
  ansible.builtin.file:
    path: /etc/logrotate.d/ms-convenio-medico-service
    state: absent

# ==========================================
# DEPENDÊNCIAS E CREDENCIAIS DE BACKUP
# ==========================================
- name: Garantir que o AWS CLI e o tar estao instalados
  ansible.builtin.apt:
    name:
      - awscli
      - tar
    state: present
    update_cache: yes

- name: Garantir que o diretorio .aws existe para o usuario ubuntu
  ansible.builtin.file:
    path: /home/ubuntu/.aws
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0700'

- name: Configurar credenciais S3 OCI para o usuario ubuntu
  ansible.builtin.copy:
    dest: /home/ubuntu/.aws/credentials
    owner: ubuntu
    group: ubuntu
    mode: '0600'
    content: |
      [default]
      aws_access_key_id = {{ s3_access_key }}
      aws_secret_access_key = {{ s3_secret_key }}

- name: Criar diretorio para os scripts de automacao
  ansible.builtin.file:
    path: /home/ubuntu/scripts
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

# ==========================================
# IMPLANTAÇÃO DOS SCRIPTS E CRONJOBS
# ==========================================
- name: Implantar script de backup do codigo fonte e WAR
  ansible.builtin.template:
    src: backup_fonte.sh.j2
    dest: /home/ubuntu/scripts/backup_fonte.sh
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Implantar script de backup exclusivo de logs
  ansible.builtin.template:
    src: backup_logs.sh.j2
    dest: /home/ubuntu/scripts/backup_logs.sh
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Agendar backup dos LOGS no Cron (00:01 AM)
  ansible.builtin.cron:
    name: "Backup Diario de Logs (OCI)"
    user: ubuntu
    minute: "1"
    hour: "0"
    job: "/home/ubuntu/scripts/backup_logs.sh >> /home/ubuntu/scripts/backup_logs.log 2>&1"

- name: Agendar backup do FONTE e WAR no Cron (02:00 AM)
  ansible.builtin.cron:
    name: "Backup Diario do Codigo Fonte e WAR (OCI)"
    user: ubuntu
    minute: "0"
    hour: "2"
    job: "/home/ubuntu/scripts/backup_fonte.sh >> /home/ubuntu/scripts/backup_fonte.log 2>&1"