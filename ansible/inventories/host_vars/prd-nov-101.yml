---
perfil_apache: true

aplicacoes:
  - id_bucket: "AdAlive-Iprevsantos"
    nome_pasta: "AdAlive-Iprevsantos"
    tipo_app: "rails"
    tipo_backup: "fonte"
    log_principal: "rails_server_iprevsantos.log"

  - id_bucket: "ipresantos-novaprev"
    caminho_base: "/home/ubuntu"                                      
    nome_pasta: "apache-tomcat-9.0.21"                   
    tipo_app: "tomcat"
    tipo_backup: "war"
    arquivos_war:                                                    
      - "esocial-novaprev.war"
      - "esocial-servicos-iprev.war"
      - "folha.war"
      - "novaprev.war"
      - "novaprev2.war"
      - "previdencia-api.war"
      - "recadastramento.war"

  - id_bucket: "ipresantos-novaprev-debug"
    caminho_base: "/home/ubuntu"                                      
    nome_pasta: "apache-tomcat-9.0.21-debug"                   
    tipo_app: "tomcat"
    tipo_backup: "war"
    arquivos_war:                                                    
      - "esocial-novaprev.war"